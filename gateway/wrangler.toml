# Cloudflare Worker: public gateway for the India Air Quality API.
# Deploy:  npm run migrate:remote && npm run deploy
# Secrets (wrangler secret put <NAME>): ORIGIN_SECRET, ADMIN_SECRET, TURNSTILE_SECRET, RESEND_API_KEY
name = "aqi-api"
main = "src/index.ts"
compatibility_date = "2026-06-01"

# Custom domain on the xkdr.org zone. Cloudflare creates the DNS record and certificate on deploy.
routes = [{ pattern = "airquality.xkdr.org", custom_domain = true }]
workers_dev = true

[observability]
enabled = true

[vars]
# Where this Worker is reachable (used in verification emails). Update after adding a custom domain.
PUBLIC_URL = "https://airquality.xkdr.org"
# The FastAPI query service (api/): the Cloudflare Tunnel hostname in front of the `api` container,
# e.g. "https://aqi-origin.xkdr.org". Empty = query routes answer 503 until the tunnel is up (bulk files still work).
ORIGIN_URL = ""
# Turnstile widget site key (public). Widget "aqi-api signup" in the Cloudflare dashboard; secret is the TURNSTILE_SECRET Worker secret.
TURNSTILE_SITE_KEY = "0x4AAAAAAEtvqbGpWy1AGIXz"
# How people get keys. "request": they email CONTACT_EMAIL and you issue keys at /admin (no email infrastructure needed).
# "email": self-serve signup with verification links, which needs EMAIL_PROVIDER below.
SIGNUP_MODE = "request"
# Only used when SIGNUP_MODE = "email": "resend" (needs RESEND_API_KEY secret + verified sender domain) or "log".
EMAIL_PROVIDER = "log"
EMAIL_FROM = "India Air Quality API <api@xkdr.org>"
CONTACT_EMAIL = "admin@xkdr.org"
# Public demo key shown on the site: "demo" tier (10k rows/query, 300 req/min per IP, bulk files for DEMO_BULK_YEARS only). Change to rotate.
DEMO_BULK_YEARS = "2024"
DEMO_API_KEY = "aqi_demo_wbf92Qx21zX-Wa_Tg8Dx1nXe"
# Comma-separated browser origins allowed to call /v1 (for the dashboard), or "*".
ALLOWED_ORIGINS = ""
# "true" only for local development: skips Turnstile when unset and returns the verify link in the signup response.
DEV_MODE = "false"

[[d1_databases]]
binding = "KEYS"
database_name = "aqi-api-keys"
database_id = "7befe3ad-7104-4c31-85a6-690a6bbf04de"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "aqi-data"

# Rate limits are per API key (or per IP for signup/anonymous). period is 10 or 60 seconds.
[[unsafe.bindings]]
name = "LIMITER_FREE"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 60, period = 60 }

[[unsafe.bindings]]
name = "LIMITER_RESEARCH"
type = "ratelimit"
namespace_id = "1002"
simple = { limit = 600, period = 60 }

[[unsafe.bindings]]
name = "LIMITER_DASHBOARD"
type = "ratelimit"
namespace_id = "1003"
simple = { limit = 120, period = 60 }

[[unsafe.bindings]]
name = "LIMITER_SIGNUP"
type = "ratelimit"
namespace_id = "1004"
simple = { limit = 5, period = 60 }

[[unsafe.bindings]]
name = "LIMITER_DEMO"
type = "ratelimit"
namespace_id = "1006"
simple = { limit = 300, period = 60 }

[[unsafe.bindings]]
name = "LIMITER_ANON"
type = "ratelimit"
namespace_id = "1005"
simple = { limit = 30, period = 60 }

# Local development overrides: `wrangler dev` uses [env.dev]? No: wrangler dev uses the top-level config plus .dev.vars.
# Put local secrets and overrides in .dev.vars (gitignored), e.g.:
#   DEV_MODE=true
#   ORIGIN_URL=http://localhost:8010
#   ORIGIN_SECRET=dev-origin-secret
#   ADMIN_SECRET=dev-admin-secret
